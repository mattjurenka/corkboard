<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="corkboard">
  <!-- Frame and cork, in Monokai's base0F and base0A; the desktop entries
       swap these for the stylix palette's (corkboard.nix in nixosconfig). -->
  <rect width="64" height="64" rx="14" fill="#cc6633"/>
  <rect x="5" y="5" width="54" height="54" rx="10" fill="#f4bf75"/>
  <!-- The card (base05, lines base04) -->
  <g transform="rotate(-6 32 36)">
    <rect x="15" y="18" width="34" height="34" rx="3.5" fill="#f8f8f2"/>
    <rect x="21" y="30" width="22" height="3.6" rx="1.8" fill="#a59f85"/>
    <rect x="21" y="38" width="15" height="3.6" rx="1.8" fill="#a59f85"/>
  </g>
  <!-- Pushpin (base08) -->
  <ellipse cx="34.5" cy="22.5" rx="6" ry="2" fill="#000" opacity=".18"/>
  <circle cx="32" cy="18" r="7.5" fill="#f92672"/>
  <circle cx="29.6" cy="15.6" r="2.4" fill="#fff" opacity=".55"/>
</svg>
