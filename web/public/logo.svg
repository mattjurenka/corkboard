<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="corkboard">
  <!-- Frame and cork -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#8a5a33"/>
  <rect x="7" y="7" width="50" height="50" rx="7" fill="#d4a373"/>
  <g fill="#b9844f">
    <circle cx="14" cy="15" r="1.3"/><circle cx="47" cy="12" r="1"/>
    <circle cx="51" cy="44" r="1.3"/><circle cx="12" cy="49" r="1"/>
    <circle cx="33" cy="52" r="1.2"/><circle cx="52" cy="27" r="0.9"/>
  </g>
  <!-- Back card, tilted -->
  <g transform="rotate(-8 25 33)">
    <rect x="12" y="20" width="26" height="28" rx="3" fill="#e9e4d8"/>
    <rect x="16" y="30" width="16" height="2.6" rx="1.3" fill="#b8b1a2"/>
    <rect x="16" y="36" width="12" height="2.6" rx="1.3" fill="#b8b1a2"/>
  </g>
  <!-- Front card, with the accent bar -->
  <g transform="rotate(6 39 35)">
    <rect x="26" y="20" width="26" height="30" rx="3" fill="#fffdf7"/>
    <rect x="26" y="20" width="26" height="6" rx="3" fill="#7aa2f7"/>
    <rect x="26" y="23" width="26" height="3" fill="#7aa2f7"/>
    <rect x="30" y="31" width="17" height="2.6" rx="1.3" fill="#c9c2b3"/>
    <rect x="30" y="37" width="12" height="2.6" rx="1.3" fill="#c9c2b3"/>
    <rect x="30" y="43" width="14" height="2.6" rx="1.3" fill="#c9c2b3"/>
  </g>
  <!-- Pushpin -->
  <ellipse cx="40.5" cy="20.5" rx="5" ry="1.8" fill="#000" opacity="0.18"/>
  <circle cx="38" cy="17" r="5.5" fill="#e0475b"/>
  <circle cx="36.3" cy="15.3" r="1.8" fill="#fff" opacity="0.55"/>
</svg>
