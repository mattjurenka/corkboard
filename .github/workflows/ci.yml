# Every push and pull request: the types, the tests that need no Worker,
# and a compiled bridge tried on each OS (scripts/smoke-bridge.ts).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The plugin's tests and the terminal's run a real Neovim, the one the
      # flake pins; git makes their repositories and worktrees.
      - name: Neovim 0.12.6
        run: |
          curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: git config --global user.name ci && git config --global user.email ci@localhost && git config --global init.defaultBranch main
      - run: bun run typecheck
      - run: bun run test:fleet
      - run: bun run test:e2ee
      - run: bun run test:lib
      - run: bun run test:bridge
      - run: bun run test:mcp
      - run: bun run test:nvim
      - run: bun run test:web
      - run: bun run test:terminal
      - run: bun run build

  # The flake's checks but multi-node (four VMs): the fleet's, its packages'
  # imports, the page's Neovim and libuv built for wasm and run, and a
  # session's browser taken over (two VMs).
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#checks.x86_64-linux.{fleet,fleet-host,fleet-package,forge-gate-package,nvim-smoke,libuv-smoke,browser}

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The tests drive the relay with lib/e2ee, whose packages are the root's.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # No lookup by a key an object might inherit (scripts/lint-keys.ts), everywhere: here, where both sets of types are.
      - run: bun run lint:keys
        working-directory: .

  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/build-bridge.ts --no-speech
      - run: bun scripts/smoke-bridge.ts
